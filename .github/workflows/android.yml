
name: Build DOMINO RIAK APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q domino-riak-offline-nov-24-2026-8-34-19-am.zip -d extracted

      - name: Build Android APK
        working-directory: extracted/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOMINO-RIAK-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
