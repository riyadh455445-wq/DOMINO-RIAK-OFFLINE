
name: Build DOMINO RIAK APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q domino-riak-offline-nov-24-2026-8-34-19-am.zip -d extracted

      - name: Fix Compose BOM dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/android/gradle/libs.versions.toml")

          if not p.exists():
              raise SystemExit("Gradle version catalog not found")

          content = p.read_text()

          old = 'group = "androidx.compose.bom"'
          new = 'group = "androidx.compose"'

          if old in content:
              content = content.replace(old, new)
              p.write_text(content)
              print("Compose BOM dependency corrected")
          elif new in content:
              print("Compose BOM dependency already correct")
          else:
              raise SystemExit("Compose BOM entry not found")

      - name: Verify Android project
        run: |
          test -f extracted/android/settings.gradle.kts
          test -f extracted/android/app/build.gradle.kts
          test -f extracted/android/gradle/libs.versions.toml
          echo "Android project files verified"

      - name: Build Debug APK
        working-directory: extracted/android
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOMINO-RIAK-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
