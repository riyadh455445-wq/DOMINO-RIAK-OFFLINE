
name: Build DOMINO RIAK APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build DOMINO RIAK APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q domino-riak-offline-nov-24-2026-8-34-19-am.zip -d extracted

      - name: Fix Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/android/gradle/libs.versions.toml")

          if not p.exists():
              raise SystemExit("ERROR: libs.versions.toml not found")

          content = p.read_text()

          old_bom = 'group = "androidx.compose.bom", name = "compose-bom"'
          new_bom = 'group = "androidx.compose", name = "compose-bom"'

          if old_bom in content:
              content = content.replace(old_bom, new_bom)
          elif new_bom not in content:
              raise SystemExit("ERROR: Compose BOM declaration not found")

          pattern = r'(?m)^(\s*androidx-material-icons-extended\s*=\s*)\{.*\}\s*$'

          replacement = (
              r'\1{ group = "androidx.compose.material", '
              r'name = "material-icons-extended", version = "1.7.5" }'
          )

          content, count = re.subn(pattern, replacement, content)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected one Material Icons declaration, found {count}"
              )

          p.write_text(content)
          print("Android dependencies corrected successfully")
          PY

      - name: Verify project files
        run: |
          test -f extracted/android/settings.gradle.kts
          test -f extracted/android/app/build.gradle.kts
          test -f extracted/android/gradle/libs.versions.toml
          echo "Project verification successful"

      - name: Build Debug APK
        working-directory: extracted/android
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOMINO-RIAK-APK
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
